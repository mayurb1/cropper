<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react-pixcraft – Local Dev</title>
    <style>
      html {
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, #24292f 28%, #d0d7de) transparent;
      }
      html::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      html::-webkit-scrollbar-track {
        background: transparent;
      }
      html::-webkit-scrollbar-thumb {
        background: color-mix(in srgb, #24292f 26%, #d0d7de);
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/demo/main.jsx"></script>
  </body>
</html>
